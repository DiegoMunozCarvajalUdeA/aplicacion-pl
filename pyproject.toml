[project]
name = "plapp"
version = "0.1.0"
description = "Entorno académico para una aplicación de programación lineal"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.54,<2",
    "plotly>=6,<7",
    "fpdf2>=2.8,<3",
    "fonttools>=4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "hypothesis>=6,<7",
    "ruff>=0.11,<1",
    "scipy>=1.15,<2",
    "playwright>=1.50,<2",
    "pypdf>=6,<8",
    "markdown-it-py>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plapp"]

[tool.hatch.build.targets.wheel.force-include]
"assets/fonts" = "plapp/assets/fonts"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["plapp"]

